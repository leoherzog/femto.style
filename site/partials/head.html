<script>
  // The ?theme= script (Decision 8): document.write parser-inserts the theme's <link> before paint.
  if (location.pathname === "/docs") {
    const theme = new URLSearchParams(location.search).get("theme");
    const colors = ["amber", "blue", "cyan", "fuchsia", "green", "grey", "indigo", "jade", "lime", "orange",
      "pink", "pumpkin", "purple", "red", "sand", "slate", "violet", "yellow", "zinc"];
    if (colors.includes(theme)) document.write(`<link rel="stylesheet" href="/vendor/femto/css/themes/${theme}.css">`);
  }
</script>
<script>
  // The color-scheme script (Decision 14), which also holds Firefox's paint for that <link>.
  try {
    const scheme = JSON.parse(localStorage.getItem("femtoColorScheme"));
    if (scheme === "light" || scheme === "dark") document.documentElement.dataset.theme = scheme;
  } catch {
    // No storage or no valid JSON: keep the OS scheme.
  }
</script>
