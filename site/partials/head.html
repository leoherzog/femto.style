<script>
  // The page's only render-blocking script (criterion 15). The reader's color-scheme choice
  // is kept as JSON ("light" or "dark") in localStorage femtoColorScheme, the oracle's key and
  // format (Decision 14); data-theme is set on <html> only when a choice is stored, and before
  // the first paint, so a stored choice never flashes.
  try {
    const scheme = JSON.parse(localStorage.getItem("femtoColorScheme"));
    if (scheme === "light" || scheme === "dark") document.documentElement.dataset.theme = scheme;
  } catch {
    // No storage (private mode, blocked cookies) or no valid JSON: keep the OS scheme.
  }
</script>
<script type="module" src="/assets/js/site.js"></script>
