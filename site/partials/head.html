<script>
  // The first of the page's two render-blocking scripts, the ?theme= script (criterion 15). On the
  // docs page, ?theme=<color> adds that femto theme color (Decision 8, 02 §5). Its <link> is written
  // by document.write, so the parser inserts it, after femto's stylesheets (docs.html links them
  // before this partial), and the theme's :root tokens come after femto's. Chrome holds its first
  // paint for that <link> as a render-blocking stylesheet. Firefox holds its first paint for it only
  // because the next script, a parser-blocking one, waits for that pending stylesheet before it
  // runs; so the color-scheme script stays a separate script after this one (probed in Phase 3 in
  // headless Firefox 160 with jade.css held 300 ms: with one script the first contentful paint came
  // at 80 to 277 ms, before jade.css's responseEnd; with a static inline script after this one, at
  // 455 to 588 ms, after it; a script that document.write adds after the <link> did not hold the
  // paint). A <link> added with createElement is not parser-inserted, blocks neither, and the
  // default paints first. Only the 20 color names in vendor/femto/css/themes/ are taken: azure, the
  // default, writes nothing, and anything else is ignored.
  if (location.pathname === "/docs") {
    const theme = new URLSearchParams(location.search).get("theme");
    const colors = ["amber", "blue", "cyan", "fuchsia", "green", "grey", "indigo", "jade", "lime", "orange",
      "pink", "pumpkin", "purple", "red", "sand", "slate", "violet", "yellow", "zinc"];
    if (colors.includes(theme)) document.write(`<link rel="stylesheet" href="/vendor/femto/css/themes/${theme}.css">`);
  }
</script>
<script>
  // The second render-blocking script, the color-scheme script (criterion 15). The reader's
  // color-scheme choice is kept as JSON ("light" or "dark") in localStorage femtoColorScheme, the
  // oracle's key and format (Decision 14); data-theme is set on <html> only when a choice is stored,
  // and before the first paint, so a stored choice never flashes. As a parser-blocking script after
  // the ?theme= script, it is also what holds Firefox's first paint for the theme's <link> (above).
  try {
    const scheme = JSON.parse(localStorage.getItem("femtoColorScheme"));
    if (scheme === "light" || scheme === "dark") document.documentElement.dataset.theme = scheme;
  } catch {
    // No storage (private mode, blocked cookies) or no valid JSON: keep the OS scheme.
  }
</script>
<script type="module" src="/assets/js/site.js"></script>
