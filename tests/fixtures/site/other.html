<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harness fixture: other page</title>
<script>
  try {
    var t = JSON.parse(localStorage.getItem("femtoColorScheme"));
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<link rel="stylesheet" href="/fixture.css">
</head>
<body>
<main id="content">
  <h1>Other page</h1>
  <p>A second route, removed on side B by the status-404 control. <a href="/index.html" id="near">Back</a></p>
  <div class="spacer"></div>
  <p id="spy" data-positions="1"><a href="/" id="far">A link below the fold</a></p>
</main>
<script>
  // A scroll spy, like the site's table of contents: it counts the scroll positions the page has
  // been at. An instant scroll lands on one position and a smooth one passes through many, so the
  // state replays of #far (states.json) leave the same count on both sides only while the replay's
  // scrolling is instant (differ.js armStates; control scroll-smooth).
  (function () {
    var spy = document.getElementById("spy"), seen = {};
    seen[scrollX + "," + scrollY] = 1;
    addEventListener("scroll", function () {
      seen[scrollX + "," + scrollY] = 1;
      spy.setAttribute("data-positions", String(Object.keys(seen).length));
    }, { passive: true });
  })();
</script>
</body>
</html>
