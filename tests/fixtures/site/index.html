<!-- The selftest site (not part of femto.style). Like the site (PLAN.md Decision 14), a theme stored
     in localStorage femtoColorScheme (JSON) sets data-theme on <html> before the first paint. -->
<script>
  try {
    var t = JSON.parse(localStorage.getItem("femtoColorScheme"));
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
