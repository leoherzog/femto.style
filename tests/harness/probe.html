<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rig probe</title>
<!-- The rig's probe (harness/rig.py), served by the rig's own server: whether page scripts run, and
     after a preload script; the color-scheme mechanisms; whether hover, active and focus-visible
     input reach the page; and probe.css, which the rig loads warm, cold and held. -->
<script>
  window.__rigScript = {ran: true, afterPreload: window.__rigPreload === true};
</script>
<link rel="stylesheet" href="/__rig/probe.css">
<style>
  .cs { color-scheme: light dark; color: light-dark(rgb(0, 0, 1), rgb(0, 0, 2)); }
  #hv { color: rgb(0, 0, 0); }
  #hv:hover { color: rgb(255, 0, 0); }
  #ac:active { color: rgb(0, 255, 0); }
  #fv:focus-visible { color: rgb(0, 0, 255); }
</style>
</head>
<body>
<p id="cs" class="cs">light-dark</p>
<p>
  <a href="#x" id="pre">previous link</a>
  <button id="hv" type="button">hover</button>
  <button id="ac" type="button">active</button>
  <a href="#y" id="fv">focus-visible</a>
</p>
</body>
</html>
